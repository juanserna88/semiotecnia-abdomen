document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

it',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}\n*{box-sizing:border-box}\na{color:#1D8446}a:hover{color:#04302B}\nbutton{font:inherit;color:inherit}\nh1,h2,h3,h4,p{margin:0}\nh1,h2,h3{text-wrap:balance}\np{text-wrap:pretty}\ninput[type=range]{width:100%;accent-color:#1D8446}\nselect,input[type=number]{font:inherit;font-size:15.5px;padding:9px 10px;border-radius:10px;border:1px solid #D3E4DC;background:#fff;color:#04302B;width:100%}\n:focus-visible{outline:3px solid #3CC168;outline-offset:2px;border-radius:8px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<header style=\"position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #D3E4DC\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:16px\">\n    <a href=\"/\" style=\"display:flex;align-items:center;gap:16px;text-decoration:none;min-width:0\">\n      <div style=\"width:132px;height:54px;overflow:hidden;position:relative;flex-shrink:0\">\n        <img src=\"6f764c7e-2cf6-45c8-9fc8-38524a6a4ef5\" alt=\"MedON\" style=\"position:absolute;width:149px;left:-8px;top:-49px;mix-blend-mode:multiply\">\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;padding-left:16px;border-left:1px solid #D3E4DC;min-width:0\">\n        <span style=\"font-size:17px;font-weight:700;color:#04302B;line-height:1.2\">Semiotecnia del abdomen<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#1D8446\">STUDENT · SEMIOLOGÍA<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n  <nav aria-label=\"Capítulos\" style=\"border-top:1px solid #EAF6EE;overflow-x:auto;scrollbar-width:none\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ c.go }}\" style=\"border:0;background:transparent;padding:9px 11px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:{{ c.fw }};color:{{ c.fg }};box-shadow:inset 0 -2px 0 {{ c.bar }}\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;margin-right:6px;opacity:.7\">{{ c.n }}<\u002Fspan>{{ c.t }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fnav>\n  <div style=\"position:absolute;left:0;bottom:-1px;height:3px;background:#3CC168;width:{{ prog }}\"><\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"inicio\" style=\"background:#04302B;color:#F1F8F6\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:48px 16px 44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:36px;align-items:center\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#3CC168\">SEMIOLOGÍA CLÍNICA · EXAMEN FÍSICO<\u002Fdiv>\n      <h1 style=\"font-size:clamp(36px,5.4vw,62px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:12px 0 14px\">Semiotecnia del <span style=\"color:#3CC168\">abdomen<\u002Fspan><\u002Fh1>\n      <p style=\"max-width:52ch;opacity:.88;font-size:18px\">Cómo explorar el abdomen paso a paso: qué buscar en cada tiempo del examen, cómo describir lo que encuentras y qué signos orientan el diagnóstico.<\u002Fp>\n      <div style=\"margin-top:22px;display:flex;gap:10px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ goMapa }}\" style=\"border:0;background:#3CC168;color:#04302B;font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer\">Explorar el mapa abdominal<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goSignos }}\" style=\"border:1px solid rgba(255,255,255,.3);background:transparent;color:#F1F8F6;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer\">Signos y maniobras<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goQuiz }}\" style=\"border:1px solid rgba(255,255,255,.3);background:transparent;color:#F1F8F6;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer\">Practicar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#3CC168\">ORDEN DEL EXAMEN<\u002Fdiv>\n      <div style=\"display:grid;gap:8px;margin-top:14px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ s.go }}\" style=\"display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#F1F8F6;border-radius:12px;padding:9px 12px;cursor:pointer\">\n            <span style=\"width:32px;height:32px;border-radius:50%;background:#3CC168;color:#04302B;display:grid;place-items:center;font-weight:800\">{{ s.n }}<\u002Fspan>\n            <span><b style=\"display:block;font-weight:600\">{{ s.t }}<\u002Fb><span style=\"font-size:13.5px;opacity:.75\">{{ s.d }}<\u002Fspan><\u002Fspan>\n            <span style=\"opacity:.6\">→<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size:14px;opacity:.8;margin-top:14px\">Ausculta antes de palpar y percutir: la manipulación modifica la motilidad intestinal.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<main style=\"max-width:1180px;margin:0 auto;padding:8px 16px 64px\">\n\n  <section id=\"mapa\" style=\"padding-top:44px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">00<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Topografía abdominal<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Nueve regiones · toca una para ver qué contiene y qué explorar<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:18px\">\n        <div style=\"max-width:380px;margin:0 auto;border:2px solid #04302B;border-radius:44px 44px 70px 70px;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr 1fr\">\n          <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"9\">\n            <button sc-camel-on-click=\"{{ r.pick }}\" aria-pressed=\"{{ r.on }}\" style=\"aspect-ratio:1/1.05;border:0;border-right:1px dashed #9FC2B2;border-bottom:1px dashed #9FC2B2;background:{{ r.bg }};color:{{ r.fg }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;transition:background .2s\">\n              <b style=\"font-family:'IBM Plex Mono',monospace;font-size:15px\">{{ r.ab }}<\u002Fb>\n              <span style=\"font-size:11.5px;line-height:1.2;text-align:center;opacity:.85\">{{ r.short }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"text-align:center;font-size:13px;color:#4A6660;margin-top:10px\">Vista anterior. Derecha del paciente a la izquierda de la pantalla.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">{{ reg.ab }} · REGIÓN<\u002Fdiv>\n        <h3 style=\"font-size:24px;font-weight:700;margin-top:4px\">{{ reg.n }}<\u002Fh3>\n        <div style=\"margin-top:14px;font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:#4A6660\">ESTRUCTURAS<\u002Fdiv>\n        <p style=\"margin-top:4px\">{{ reg.org }}<\u002Fp>\n        <div style=\"margin-top:14px;font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:#4A6660\">PIENSA EN<\u002Fdiv>\n        <p style=\"margin-top:4px\">{{ reg.dx }}<\u002Fp>\n        <div style=\"margin-top:14px;font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:#4A6660\">SIGNOS Y MANIOBRAS<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:8px\">\n          <sc-for list=\"{{ regSigns }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ g.open }}\" style=\"border:1px solid #1D8446;background:#EAF6EE;color:#04302B;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14.5px\">{{ g.n }} →<\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ regNoSigns }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#4A6660;font-size:14.5px\">{{ reg.alt }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"inspeccion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">01<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Inspección<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Paciente en decúbito supino, brazos a los lados, abdomen descubierto de xifoides a pubis, buena luz<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;color:#1D8446\">¿QUÉ SE BUSCA? · TOCA CADA ELEMENTO<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px\">\n      <sc-for list=\"{{ insp }}\" as=\"i\" hint-placeholder-count=\"10\">\n        <button sc-camel-on-click=\"{{ i.pick }}\" aria-pressed=\"{{ i.on }}\" style=\"text-align:left;border:1px solid {{ i.bd }};background:{{ i.bg }};color:{{ i.fg }};border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px\">\n          <b style=\"font-weight:600\">{{ i.t }}<\u002Fb><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;opacity:.7\">{{ i.seen }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">OBSERVA<\u002Fdiv>\n        <h3 style=\"font-size:22px;font-weight:700;margin-top:4px\">{{ ins.t }}<\u002Fh3>\n        <p style=\"margin-top:8px;color:#4A6660\">{{ ins.q }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:8px\">\n        <sc-for list=\"{{ ins.f }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"background:#F4F8F6;border-radius:12px;padding:12px 14px\"><b style=\"font-weight:600\">{{ f.0 }}<\u002Fb><p style=\"font-size:15px;color:#4A6660;margin-top:2px\">{{ f.1 }}<\u002Fp><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;color:#4A6660;margin-top:12px\">Revisados: <b style=\"color:#1D8446\">{{ inspCount }}<\u002Fb> de 10<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"auscultacion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">02<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Auscultación<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Antes de percutir y palpar · diafragma del estetoscopio, apoyo suave<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">01<\u002Fdiv><h3 style=\"font-size:19px;font-weight:700;margin-top:4px\">Ruidos intestinales<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Presencia, frecuencia y características. Escucha al menos 1 minuto en un punto (habitualmente mesogastrio).<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">02<\u002Fdiv><h3 style=\"font-size:19px;font-weight:700;margin-top:4px\">Soplos vasculares<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Aorta, renales, ilíacas y femorales. Usa la campana y algo más de presión.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#1D8446;letter-spacing:.1em\">03<\u002Fdiv><h3 style=\"font-size:19px;font-weight:700;margin-top:4px\">Roces<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Sobre hígado y bazo, sincrónicos con la respiración: inflamación de la cápsula (tumor, infarto esplénico, perihepatitis).<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;margin-top:18px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">INTERPRETA LO QUE ESCUCHAS<\u002Fdiv>\n        <label style=\"display:flex;justify-content:space-between;font-weight:600;margin-top:14px\"><span>Ruidos por minuto<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#1D8446\">{{ rpm }}<\u002Fspan><\u002Flabel>\n        <input type=\"range\" min=\"0\" max=\"50\" step=\"1\" value=\"{{ rpm }}\" sc-camel-on-change=\"{{ setRpm }}\" style=\"margin-top:8px\">\n        <button sc-camel-on-click=\"{{ toggleMetal }}\" style=\"display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer;font-size:15.5px;border:0;background:transparent;padding:0;text-align:left\"><span style=\"width:20px;height:20px;border-radius:6px;border:2px solid #1D8446;background:{{ metalBox }};flex-shrink:0\"><\u002Fspan>Tono agudo, metálico (en lucha)<\u002Fbutton>\n        <div style=\"margin-top:16px;border-radius:14px;padding:16px;background:{{ aus.bg }}\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:{{ aus.fg }}\">{{ aus.tag }}<\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:800;margin-top:2px\">{{ aus.t }}<\u002Fdiv>\n          <p style=\"font-size:15.5px;margin-top:6px\">{{ aus.d }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#4A6660;margin-top:10px\">Referencia: normal ≈ 5–34 por minuto. Para declararlos ausentes, ausculta 2–3 minutos sin oírlos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">FOCOS DE SOPLOS<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ soplos }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ s.pick }}\" style=\"border:1px solid {{ s.bd }};background:{{ s.bg }};color:{{ s.fg }};padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px\">{{ s.t }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;background:#F4F8F6;border-radius:14px;padding:16px\">\n          <b style=\"font-weight:700;font-size:18px\">{{ sop.t }}<\u002Fb>\n          <p style=\"margin-top:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#1D8446\">DÓNDE · <\u002Fspan>{{ sop.w }}<\u002Fp>\n          <p style=\"margin-top:6px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#B3261E\">SUGIERE · <\u002Fspan>{{ sop.s }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"palp-sup\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">03<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Palpación superficial<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Mano plana, dedos juntos, depresión de 1–2 cm · empieza lejos de la zona dolorosa<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">¿QUÉ ENCONTRASTE? · MARCA LOS HALLAZGOS<\u002Fdiv>\n        <div style=\"display:grid;gap:8px;margin-top:12px\">\n          <sc-for list=\"{{ ps }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.on }}\" style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:1px solid {{ p.bd }};background:{{ p.bg }};border-radius:12px;padding:11px 14px;cursor:pointer\">\n              <span style=\"width:20px;height:20px;border-radius:6px;border:2px solid #1D8446;background:{{ p.box }};margin-top:2px\"><\u002Fspan>\n              <span><b style=\"font-weight:600;display:block\">{{ p.t }}<\u002Fb><span style=\"font-size:14.5px;color:#4A6660\">{{ p.d }}<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:14px;align-content:start\">\n        <div style=\"border-radius:16px;padding:18px;background:{{ psOut.bg }}\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:{{ psOut.fg }}\">{{ psOut.tag }}<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:800;margin-top:2px\">{{ psOut.t }}<\u002Fdiv>\n          <p style=\"font-size:15.5px;margin-top:6px\">{{ psOut.d }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)\">\n            <div style=\"padding:14px 16px;background:#EAF6EE\"><b>Defensa<\u002Fb><\u002Fdiv>\n            <div style=\"padding:14px 16px;background:#FBE4E1\"><b>Rigidez<\u002Fb><\u002Fdiv>\n            <div style=\"padding:12px 16px;border-top:1px solid #D3E4DC;font-size:15px\">Contracción localizada de la pared al palpar; puede ser voluntaria<\u002Fdiv>\n            <div style=\"padding:12px 16px;border-top:1px solid #D3E4DC;font-size:15px\">Contracción involuntaria y persistente, a menudo generalizada<\u002Fdiv>\n            <div style=\"padding:12px 16px;border-top:1px solid #D3E4DC;font-size:15px\">Disminuye si el paciente se relaja o flexiona las rodillas<\u002Fdiv>\n            <div style=\"padding:12px 16px;border-top:1px solid #D3E4DC;font-size:15px\">No cede: «abdomen en tabla» → peritonitis<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"palp-prof\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">04<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Palpación profunda<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Depresión de 4–5 cm, una o dos manos (bimanual) · masas profundas, visceromegalias y micro-Blumberg<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><h3 style=\"font-size:19px;font-weight:700\">Masas profundas<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Diferencia de la pared: si la masa se hace más evidente al contraer el recto (levantar la cabeza), es parietal.<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><h3 style=\"font-size:19px;font-weight:700\">Visceromegalias<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Hígado: borde bajo el reborde costal en inspiración. Bazo: desde FII hacia HCI; decúbito lateral derecho (Schuster).<\u002Fp><\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:16px;padding:18px\"><h3 style=\"font-size:19px;font-weight:700\">Micro-Blumberg<\u002Fh3><p style=\"color:#4A6660;font-size:15.5px;margin-top:4px\">Dolor con una presión y liberación pequeñas y suaves: irritación peritoneal sin necesidad de una descompresión brusca.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;margin-top:18px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">SI HAY UNA MASA, DESCRÍBELA<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;margin-top:14px\">\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Ubicación\n          <sc-raw-select sc-camel-on-change=\"{{ setM.reg }}\"><sc-for list=\"{{ mo.reg }}\" as=\"o\"><option value=\"{{ o.v }}\" selected=\"{{ o.sel }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Tamaño (cm)\n          <input type=\"number\" min=\"1\" max=\"30\" value=\"{{ m.size }}\" sc-camel-on-change=\"{{ setM.size }}\"><\u002Flabel>\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Consistencia\n          <sc-raw-select sc-camel-on-change=\"{{ setM.cons }}\"><sc-for list=\"{{ mo.cons }}\" as=\"o\"><option value=\"{{ o.v }}\" selected=\"{{ o.sel }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Movilidad\n          <sc-raw-select sc-camel-on-change=\"{{ setM.mov }}\"><sc-for list=\"{{ mo.mov }}\" as=\"o\"><option value=\"{{ o.v }}\" selected=\"{{ o.sel }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Dolor\n          <sc-raw-select sc-camel-on-change=\"{{ setM.dolor }}\"><sc-for list=\"{{ mo.dolor }}\" as=\"o\"><option value=\"{{ o.v }}\" selected=\"{{ o.sel }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <label style=\"display:grid;gap:6px;font-weight:600;font-size:14.5px\">Bordes y superficie\n          <sc-raw-select sc-camel-on-change=\"{{ setM.sup }}\"><sc-for list=\"{{ mo.sup }}\" as=\"o\"><option value=\"{{ o.v }}\" selected=\"{{ o.sel }}\">{{ o.t }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ togglePul }}\" style=\"display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer;font-size:15.5px;border:0;background:transparent;padding:0;text-align:left\"><span style=\"width:20px;height:20px;border-radius:6px;border:2px solid #1D8446;background:{{ pulBox }};flex-shrink:0\"><\u002Fspan>Pulsátil y expansiva<\u002Fbutton>\n      <div style=\"margin-top:16px;background:#04302B;color:#F1F8F6;border-radius:14px;padding:18px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#3CC168\">PARA LA HISTORIA CLÍNICA<\u002Fdiv>\n        <p style=\"font-size:18px;margin-top:6px\">{{ massText }}<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{ massAlert }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:12px;background:#FBE4E1;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:#B3261E;color:#fff;padding:3px 8px;border-radius:6px;flex-shrink:0;margin-top:2px\">ALERTA<\u002Fspan><span style=\"font-size:15.5px\">{{ massAlert }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"percusion\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">05<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Percusión<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Timpanismo y matidez, su distribución, límites hepáticos, líquido libre y dolor a la percusión<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">MATIDEZ HEPÁTICA · LÍNEA MEDIOCLAVICULAR<\u002Fdiv>\n        <label style=\"display:flex;justify-content:space-between;font-weight:600;margin-top:14px\"><span>Hepatometría<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;color:#1D8446\">{{ hep }} cm<\u002Fspan><\u002Flabel>\n        <input type=\"range\" min=\"0\" max=\"20\" step=\"1\" value=\"{{ hep }}\" sc-camel-on-change=\"{{ setHep }}\" style=\"margin-top:8px\">\n        <div style=\"margin-top:12px;height:14px;border-radius:99px;background:#EAF6EE;position:relative;overflow:hidden\">\n          <div style=\"position:absolute;left:30%;width:30%;top:0;bottom:0;background:#3CC168;opacity:.45\"><\u002Fdiv>\n          <div style=\"position:absolute;top:0;bottom:0;left:0;width:{{ hepPct }};background:{{ hepOut.bar }};border-radius:99px;transition:width .3s\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#4A6660;margin-top:4px\"><span>0<\u002Fspan><span>6–12 cm normal<\u002Fspan><span>20<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:14px;border-radius:14px;padding:16px;background:{{ hepOut.bg }}\">\n          <div style=\"font-size:21px;font-weight:800\">{{ hepOut.t }}<\u002Fdiv>\n          <p style=\"font-size:15.5px;margin-top:4px\">{{ hepOut.d }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;color:#4A6660;margin-top:10px\">Percute de arriba (pulmón, resonante) hacia abajo hasta la matidez, y de abajo (timpanismo) hacia arriba. Mide entre ambos límites.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">LÍQUIDO LIBRE · SI SE SOSPECHA ASCITIS<\u002Fdiv>\n        <div style=\"display:inline-flex;flex-wrap:wrap;gap:4px;background:#EAF6EE;padding:4px;border-radius:12px;margin-top:12px\">\n          <sc-for list=\"{{ asc }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ a.pick }}\" style=\"border:0;background:{{ a.bg }};box-shadow:{{ a.sh }};padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14.5px;color:#04302B\">{{ a.t }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <h3 style=\"font-size:20px;font-weight:700;margin-top:16px\">{{ ascSel.t }}<\u002Fh3>\n        <div style=\"display:grid;gap:10px;margin-top:10px;counter-reset:s\">\n          <sc-for list=\"{{ ascSel.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start\"><span style=\"width:28px;height:28px;border-radius:50%;background:#04302B;color:#F1F8F6;display:grid;place-items:center;font-weight:700;font-size:14px\">{{ st.n }}<\u002Fspan><p style=\"font-size:15.5px;padding-top:2px\">{{ st.t }}<\u002Fp><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;background:#EAF6EE;border-radius:12px;padding:12px 14px;font-size:15px\"><b>Positivo: <\u002Fb>{{ ascSel.pos }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;background:#FCEFD9;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:#A8650A;color:#fff;padding:3px 8px;border-radius:6px;flex-shrink:0;margin-top:2px\">PERLA<\u002Fspan><span style=\"font-size:15.5px\">Timpanismo donde debería estar la matidez hepática (signo de Jobert) sugiere neumoperitoneo por víscera perforada. El dolor a la percusión suave equivale a un micro-Blumberg.<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"signos\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">06<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Signos y maniobras<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">Filtra por región y abre cada signo: técnica, cuándo es positivo y qué sugiere<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n      <sc-for list=\"{{ sf }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ f.pick }}\" style=\"border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};padding:7px 14px;border-radius:999px;cursor:pointer;font-size:15px\">{{ f.t }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:16px;align-items:start\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px\">\n        <sc-for list=\"{{ signList }}\" as=\"g\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ g.pick }}\" aria-pressed=\"{{ g.on }}\" style=\"text-align:left;border:1px solid {{ g.bd }};background:{{ g.bg }};color:{{ g.fg }};border-radius:12px;padding:11px 12px;cursor:pointer;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;opacity:.75\">{{ g.zone }}<\u002Fspan>\n            <b style=\"font-weight:600;font-size:15px;line-height:1.25\">{{ g.n }}<\u002Fb>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div id=\"signo-detalle\" style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;min-width:0\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:#1D8446\">{{ sig.zone }}<\u002Fdiv>\n        <h3 style=\"font-size:26px;font-weight:800;margin-top:4px\">{{ sig.n }}<\u002Fh3>\n        <div style=\"display:grid;gap:10px;margin-top:16px\">\n          <div style=\"background:#F4F8F6;border-radius:12px;padding:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:#1D8446\">TÉCNICA<\u002Fdiv><p style=\"margin-top:4px\">{{ sig.tec }}<\u002Fp><\u002Fdiv>\n          <div style=\"background:#EAF6EE;border-radius:12px;padding:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:#1D8446\">POSITIVO<\u002Fdiv><p style=\"margin-top:4px\">{{ sig.pos }}<\u002Fp><\u002Fdiv>\n          <div style=\"background:#FBE4E1;border-radius:12px;padding:14px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:#B3261E\">SUGIERE<\u002Fdiv><p style=\"margin-top:4px;font-weight:600\">{{ sig.sug }}<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ prevSign }}\" style=\"border:1px solid #D3E4DC;background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer\">← Anterior<\u002Fbutton>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#4A6660;align-self:center\">{{ sigPos }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ nextSign }}\" style=\"border:1px solid #D3E4DC;background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer\">Siguiente →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"practica\" style=\"padding-top:52px\">\n    <div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:2px solid #04302B;padding-bottom:12px;margin-bottom:22px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:34px;color:#1D8446;line-height:1\">07<\u002Fspan>\n      <div><h2 style=\"font-size:clamp(25px,3.2vw,34px);font-weight:700\">Practica<\u002Fh2><p style=\"color:#4A6660;font-size:15px\">¿Qué signo o hallazgo es? · {{ quizLen }} casos<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #D3E4DC;border-radius:18px;padding:22px;max-width:820px\">\n      <sc-if value=\"{{ quizOn }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#4A6660\"><span>CASO {{ qn }} / {{ quizLen }}<\u002Fspan><span>ACIERTOS {{ score }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:6px;background:#EAF6EE;border-radius:99px;margin-top:8px;overflow:hidden\"><div style=\"height:100%;background:#3CC168;width:{{ qPct }};transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n        <p style=\"font-size:19px;font-weight:600;margin-top:16px\">{{ qq.q }}<\u002Fp>\n        <div style=\"display:grid;gap:8px;margin-top:14px\">\n          <sc-for list=\"{{ qOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;border:1px solid {{ o.bd }};background:{{ o.bg }};color:#04302B;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px\">{{ o.t }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ answered }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;background:#F4F8F6;border-radius:12px;padding:14px 16px;font-size:15.5px\"><b style=\"color:{{ fbColor }}\">{{ fbTitle }}<\u002Fb> {{ qq.why }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ nextQ }}\" style=\"margin-top:12px;border:0;background:#04302B;color:#F1F8F6;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:12px 0\">\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#1D8446\">RESULTADO<\u002Fdiv>\n          <div style=\"font-size:56px;font-weight:800;color:#1D8446;line-height:1.1;margin-top:6px\">{{ score }}/{{ quizLen }}<\u002Fdiv>\n          <p style=\"color:#4A6660;margin-top:6px\">{{ doneMsg }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ resetQ }}\" style=\"margin-top:16px;border:0;background:#04302B;color:#F1F8F6;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer\">Repetir<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#04302B;color:#DCEBE5\">\n  <div style=\"max-width:900px;margin:0 auto;padding:32px 16px;display:grid;gap:14px;justify-items:center;text-align:center\">\n    <p style=\"font-size:15px;line-height:1.6\">Herramienta de apoyo educativo para profesionales y estudiantes de la salud. No sustituye el juicio clínico ni la valoración individual de cada paciente.<\u002Fp>\n    <p style=\"font-size:13px;opacity:.75;max-width:80ch\">Referencias: Bickley LS. Bates. Guía de exploración física e historia clínica · Argente HA, Álvarez ME. Semiología médica · Surós J. Semiología médica y técnica exploratoria.<\u002Fp>\n    <p style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;opacity:.85\">© 2026 MedON · Medicina interactiva<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NAV=[['mapa','Topografía'],['inspeccion','Inspección'],['auscultacion','Auscultación'],['palp-sup','Palpación superficial'],['palp-prof','Palpación profunda'],['percusion','Percusión'],['signos','Signos'],['practica','Practica']];\nconst REG=[\n{k:'hcd',ab:'HCD',short:'Hipocondrio der.',n:'Hipocondrio derecho',org:'Hígado (lóbulo derecho), vesícula biliar, vía biliar, ángulo hepático del colon, polo superior del riñón derecho.',dx:'Colecistitis, coledocolitiasis, hepatitis, absceso hepático, congestión hepática.',sg:['murphy','courv']},\n{k:'epi',ab:'EPI',short:'Epigastrio',n:'Epigastrio',org:'Estómago, duodeno, páncreas, lóbulo izquierdo del hígado, aorta abdominal.',dx:'Enfermedad ácido-péptica, pancreatitis, aneurisma de aorta. Descarta origen cardiaco (síndrome coronario).',sg:[],alt:'Palpa con cuidado buscando masa pulsátil y ausculta el soplo aórtico.'},\n{k:'hci',ab:'HCI',short:'Hipocondrio izq.',n:'Hipocondrio izquierdo',org:'Bazo, cola del páncreas, ángulo esplénico del colon, estómago (fondo), polo superior del riñón izquierdo.',dx:'Esplenomegalia, infarto o rotura esplénica, pancreatitis de cola.',sg:[],alt:'Busca esplenomegalia con el paciente en decúbito lateral derecho (posición de Schuster).'},\n{k:'fd',ab:'FD',short:'Flanco der.',n:'Flanco derecho',org:'Colon ascendente, riñón y uréter derechos.',dx:'Pielonefritis, litiasis ureteral, colitis.',sg:['pielo','giord','guyon','costov']},\n{k:'meso',ab:'MESO',short:'Mesogastrio',n:'Mesogastrio (umbilical)',org:'Intestino delgado, colon transverso, epiplón, aorta y vena cava, ombligo.',dx:'Obstrucción intestinal, apendicitis temprana (dolor periumbilical), hernia umbilical, isquemia mesentérica.',sg:['pielo']},\n{k:'fi',ab:'FI',short:'Flanco izq.',n:'Flanco izquierdo',org:'Colon descendente, riñón y uréter izquierdos.',dx:'Pielonefritis, litiasis ureteral, diverticulitis del descendente.',sg:['pielo','giord','guyon','costov']},\n{k:'fid',ab:'FID',short:'Fosa ilíaca der.',n:'Fosa ilíaca derecha',org:'Ciego, apéndice, íleon terminal, ovario y trompa derechos, uréter.',dx:'Apendicitis, ileítis ','Distensión por gas'],a:1,why:'Abdomen en tabla: peritonitis, sospecha de víscera perforada.'},\n{q:'Desaparece la matidez hepática a la percusión en paciente con dolor abdominal súbito.',o:['Hepatomegalia','Signo de Jobert','Matidez cambiante','Esplenomegalia'],a:1,why:'Jobert: neumoperitoneo por perforación.'}];\nconst G='#1D8446',D='#04302B',L='#D3E4DC',S='#EAF6EE';\nclass Component extends DCLogic {\n  state={cur:'mapa',prog:0,reg:'fid',ins:0,seen:{0:1},rpm:12,metal:false,sop:0,ps:{},m:{reg:'epi',size:6,cons:'firme',mov:'móvil',dolor:'indolora',sup:'bordes regulares y superficie lisa',pul:false},hep:10,asc:0,sf:'all',sig:'murphy',qi:0,pick:null,score:0,done:false};\n  componentDidMount(){this._s=()=>{const y=window.scrollY+130;let c=NAV[0][0];for(const[id]of NAV){const e=document.getElementById(id);if(e&&e.offsetTop<=y)c=id;}const h=document.documentElement.scrollHeight-innerHeight;const p=h>0?scrollY/h*100:0;if(c!==this.state.cur||Math.abs(p-this.state.prog)>.5)this.setState({cur:c,prog:p});};addEventListener('scroll',this._s,{passive:true});this._s();}\n  componentWillUnmount(){removeEventListener('scroll',this._s);}\n  go(id){const e=document.getElementById(id);if(!e)return;window.scrollTo({top:e.getBoundingClientRect().top+scrollY-100,behavior:'smooth'});}\n  sel(on){return on?{bg:D,fg:'#F1F8F6',bd:D}:{bg:'#fff',fg:D,bd:L};}\n  renderVals(){\n    const s=this.state,set=o=>this.setState(o);\n    const nav=NAV.map(([id,t],i)=>({n:String(i).padStart(2,'0'),t,go:()=>this.go(id),fg:s.cur===id?D:'#4A6660',fw:s.cur===id?700:500,bar:s.cur===id?'#3CC168':'transparent'}));\n    const steps=['Inspección|Forma, piel, ombligo, movimientos|inspeccion','Auscultación|Ruidos, soplos y roces|auscultacion','Palpación superficial|Dolor, defensa, rigidez|palp-sup','Palpación profunda|Masas y visceromegalias|palp-prof','Percusión|Timpanismo, matidez, ascitis|percusion','Signos y maniobras|Por región|signos'].map((x,i)=>{const[t,d,id]=x.split('|');return{n:i+1,t,d,go:()=>this.go :'#fff',pulBox:m.pul?'#1D8446':'#fff',togglePul:()=>this.setState(st=>({m:{...st.m,pul:!st.m.pul}})),regOpts:REG.map(x=>({k:x.k,n:x.n})),massText,massAlert,\n      hep:h,setHep:e=>set({hep:Number(e.target.value)}),hepPct:(h/20*100)+'%',hepOut,asc,ascSel,\n      sf,signList,sig,sigPos:`${si+1} / ${list.length}`,prevSign:()=>set({sig:list[(si-1+list.length)%list.length].k}),nextSign:()=>set({sig:list[(si+1)%list.length].k}),\n      quizOn:!s.done,quizDone:s.done,quizLen:Q.length,qn:s.qi+1,qPct:((s.qi+(answered?1:0))/Q.length*100)+'%',score:s.score,qq,qOpts,answered,\n      fbTitle:ok?'Correcto.':'No exactamente.',fbColor:ok?G:'#B3261E',nextLabel:s.qi===Q.length-1?'Ver resultado':'Siguiente caso',\n      nextQ:()=>s.qi===Q.length-1?set({done:true}):set({qi:s.qi+1,pick:null}),\n      resetQ:()=>set({qi:0,pick:null,score:0,done:false}),\n      doneMsg:s.score>=8?'Dominas los signos del examen abdominal.':s.score>=5?'Buen nivel: repasa los signos que fallaste.':'Repasa los capítulos 05 y 06 y vuelve a intentarlo.'};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
